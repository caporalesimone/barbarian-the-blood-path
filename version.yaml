# Versioni del progetto. Unica fonte: build, release e manuale le leggono da qui (tools/build/gen_version.py -> out/version.inc).

# Versione del software: mostrata nel gioco (menu iniziale e RUN/STOP) e nel nome del d64 (blood_path_vX.Y.d64).
# Cresce da sola (numero minore) a ogni build con cambiamenti ai sorgenti (tools/build/bump_version.py, chiamato da build.sh);
# per una nuova versione maggiore modificala a mano.
version: "1.234"

# Impronta dei sorgenti dell'ultima build (tools/build/bump_version.py): non si modifica a mano.
source_hash: "be9f499808e55000c805753a2f5c2685790c611e"

# Versione del formato dei salvataggi (un byte, 1..255; in esadecimale 0x01..0xff).
# Da cambiare a mano ogni volta che cambia il formato del personaggio o del livello salvato:
# i salvataggi con un valore diverso vengono scartati dal gioco.
save_version: 0xc7

# Versioni delle build dei branch (tools/build/verinfo.py): tag.n, non bruciano i numeri di main.
branch_versions:
  capitoli: "capitoli.9"
