# PROPOSTA (20/11): sistema di caratteristiche e difficolta' "next". Il gioco NON lo usa: lo usa solo il simulatore dei profili
# (tools/simulators/sim_builds.py) per confrontarlo con le regole di oggi (data/rules.yaml). Decisioni del committente (20/11):
#   FOR = solo danno; DES = probabilita' di colpire (+ CA con il tetto dell'armatura, + cadenza); COS = vita, pozioni piu'
#   efficaci, danno subito leggermente ridotto; molti piu' punti (4 a livello, anche al livello 1: 80 al livello 20);
#   caratteristiche iniziali piu' basse; mostri dei primi piani piu' facili, seconda meta' piu' dura; cura delle pozioni in
#   percentuale della vita massima con un tetto. Tutti i numeri qui sotto sono PUNTI DI PARTENZA da tarare, non decisi.
#
# Scala: x = valore - 10 (punti sopra la base). Oltre soft_from punti in una caratteristica ogni punto vale meta' (rendimento
# decrescente: conviene distribuire). Ogni effetto e' "1 ogni N punti" (divisione per difetto, come sul C64).
stats:
  start: {str: 12, dex: 11, con: 12}         # oggi 16/13/15
  points: {per_level: 4, first: 1, last: 255} # 4 al livello 1 (creazione) + 4 a ogni livello: 80 al 20, e avanti nell'Abisso.
                                             # (21/11, committente) le caratteristiche salgono SOLO con i punti assegnati dal giocatore:
                                             # nessuna crescita automatica col livello (oggi rules.yaml epic_every: +1 ogni 4 livelli oltre il 20)
  soft_from: 32                              # (21/11, PG specializzato) oltre 32 punti ogni punto vale soft_rate
  soft_rate: [2, 3]                          # 2/3 (era 1/2 oltre 24)
  ring_points: 4                             # un anello +N vale N x 4 punti nella caratteristica (oggi +N al modificatore = 2N)
  str: {dmg_per: 3, dc_per: 4}               # +1 danno ogni 3 punti; CD del Battle Cry +1 ogni 4
  dex: {att_per: 0, ac_per: 16, slow: 0, speed_per: 0, extra_first: 16, extra_every: 6, extra_slopes: [10, 2.75, 2.6, 2.35, 1.8], extra_max: 100, extra_count: 5, extra_chain: false}
                                             # (21/11 notte) niente ATT dalla DES (con gli attacchi extra e i requisiti la DES dominava:
                                             # sim_builds.py); +1 CA ogni 16 (tetto dell'armatura: rules.yaml dex_cap); (21/11) niente
                                             # velocita' dalla DES: cadenza = quella dell'arma per tutti (slow 0; oggi rules.yaml
                                             # attack_speed: +12 fotogrammi all'inizio, tolti dalla DES): velocita' e attacchi extra
                                             # insieme rendevano la DES la caratteristica migliore (sim_builds.py)
                                             # (21/11, committente) attacchi extra per Slash: il primo si sblocca a 16 punti di DES sopra
                                             # 10 (DES 26), poi uno ogni 6 (22, 28, 34, 40); ognuno sale di 10 / 2,75 / 2,6 / 2,35 / 1,8 %
                                             # a punto fino al 100% (secondo tiro dopo il tiro normale andato a segno). DES del profilo
                                             # destrezza al 20 (51 punti sopra 10): 100 / 80 / 60 / 40 / 20%; nell'Abisso, con i punti
                                             # dei livelli in piu', salgono tutti e ne arrivano altri. extra_chain: il successivo solo se
                                             # il precedente e' andato a segno
  con: {hp_per_point: 3, potion_pct: 1, potion_max: 30, dr_pct: 0.4, dr_max: 20}
                                             # +3 vita a punto; pozioni +1% a punto (max +30%); danno subito -0,4% a punto (max -20%)
  hp: {base: 20, per_level: 6}               # vita = 20 + (livello-1) x 6 + 3 x COS(x)

# Requisiti degli oggetti (21/11, committente): un oggetto si usa solo con le caratteristiche richieste (valori assegnati, anelli
# compresi). Scala della proposta: FOR del profilo bilanciato ~2 livelli prima del livello dell'oggetto. Chi mette tutto in DES
# non porta la spada a due mani (profilo destrezza: FOR 28 al livello 20). Le basi nuove di data/items/next/ avranno i loro.
requirements:
  sword:         {str: 15}
  viking_sword:  {str: 30}
  chain_mail:    {str: 20}
  plate_mail:    {str: 35}
  medium_shield: {str: 15}
  tower_shield:  {str: 20}

# Cura delle pozioni: percentuale della vita massima con un tetto (oggi: 20 / 50 / 4xL+40 fissi)
potions:
  red:    {pct: 25, max: 30}
  yellow: {pct: 35, max: 90}
  violet: {pct: 45, max: 180}

# Mostri: le statistiche del bestiario vengono riportate sul profilo "bilanciato" (stesso tempo per uccidere e stesso danno
# relativo di oggi), poi spostate da questi obiettivi per piano (indice = piano 0..20, interpolati fra i punti dati).
# m_hit: probabilita' che il mostro piu' forte del piano colpisca il bilanciato; pg_hit: probabilita' che il bilanciato lo colpisca;
# hp / dmg: moltiplicatori di difficolta' (1 = come oggi). Primi piani piu' facili, seconda meta' piu' dura.
monsters:
  m_hit:  {1: 0.30, 5: 0.35, 10: 0.40, 15: 0.45, 20: 0.50}
  pg_hit: {1: 0.75, 5: 0.70, 10: 0.65, 15: 0.62, 20: 0.60}
  hp:     {1: 0.75, 4: 0.85, 8: 1.0, 12: 1.15, 16: 1.3, 20: 1.4}
  dmg:    {1: 0.70, 4: 0.85, 8: 1.0, 12: 1.15, 16: 1.3, 20: 1.4}
  extra_weight: 0.6    # (21/11) quota del danno del PG che passa dagli Slash: solo quella si moltiplica con gli attacchi extra della DES

# Profili di PG: quota dei punti per caratteristica (i punti vanno assegnati uno alla volta seguendo le quote), armatura piu'
# pesante che il profilo indossa (light/medium/heavy) e arma (one: spada a una mano e scudo; ref: quella del riferimento).
# L'anello del riferimento va sulla caratteristica principale del profilo.
profiles:
  forza:        {share: {str: 60, dex: 20, con: 20}, armor: heavy,  weapon: ref, ring: str}
  destrezza:    {share: {str: 20, dex: 60, con: 20}, armor: light,  weapon: one, ring: dex}
  costituzione: {share: {str: 20, dex: 20, con: 60}, armor: heavy,  weapon: ref, ring: con}
  bilanciato:   {share: {str: 34, dex: 33, con: 33}, armor: medium, weapon: ref, ring: str}

# ---------------------------------------------------------------- boss di capitolo (20/11, PROPOSTA)
# Meccaniche per il simulatore (tools/simulators/boss_scripts.py). "game" = come e' nel codice dal 19/11 (bestiario,
# src/game/ovl_boss*.asm; il Lord of Ruin: solo evocazioni); "new" = aggiunte proposte il 20/11. Tempi in fotogrammi (50 = 1 s).
# skill: probabilita' che il giocatore schivi un colpo annunciato (avviso visibile): il simulatore non si muove, la usa cosi'.
# Danni delle meccaniche: multipli del danno medio di un colpo del boss. hp_mult / dmg_mult: vita e danno del boss in piu'
# (taratura: dmg_mult a mano, hp_mult da `sim_builds.py --fit-bosses`; si applicano solo con le meccaniche).
# Obiettivo (committente, 20/11): al livello del piano ~60% di vittorie con la cintura piena, +2 livelli 80-90%.
bosses:
  skill: 0.5
  target: {level0: 0.60, level2: 0.85}
  abbot:                      # capitolo 1, cripta (piano 5)
    hp_mult: 0.57
    dmg_mult: 0.8
    game: {summon_at: [0.667, 0.333], summon_n: 2, summon_type: skeleton, pause: 50, regen_every: 25}
    new:
      changes: {regen_every: 50}                                                # proposta: rigenerazione dimezzata
      crypt_rise: {every: 600, travel: [50, 150], max_alive: 3, type: skeleton}   # scheletri dai sarcofagi a caso
      censer: {every: 400, warn: 50, dmg: 0.5, ticks: 3, tick_every: 50}        # nube d'incenso attorno all'abate
  stitch:                     # capitolo 2, palude (piano 10)
    hp_mult: 1.4
    dmg_mult: 1.0
    game: {rites_at: [1.0, 0.667, 0.333], fetish_n: 2, fetish_hp_div: 16, protect_div: 2, regen_every: 25, exposed: 100, exposed_mult: 2}
    new:
      changes: {fetish_hp_div: 8, exposed: 75}                                  # proposta: feticci piu' robusti, scoperta piu' breve
      hex: {every: 400, warn: 40, slow: 1.6, duration: 150}                     # maledizione: cadenza del PG x1,6 per 3 s
      fetish_rot: {after: 500, type: zombie}                                    # feticcio non abbattuto in 10 s -> un annegato
  varok:                      # capitolo 3, grotta (piano 15)
    hp_mult: 0.68
    dmg_mult: 0.65
    game: {charge_every: 300, charge_hits: 2, wall_stun: 100, shield_div: 2}
    new:
      changes: {charge_every: 350}                                              # proposta: cariche un po' piu' rade
      ghouls: {at: 0.5, n: 2, type: zombie}                                     # chiama 2 Ash Ghoul
      oathbreak: {at: 0.5, rate_mult: 0.67, charge_every: 250}                  # getta lo scudo: niente dimezzamento, piu' veloce
  lord:                       # capitolo 4, cittadella (piano 20): evocazioni del gioco (final_summons) sempre
    hp_mult: 0.28
    dmg_mult: 0.4
    game: {}
    new:
      pentacle: {at: [0.75, 0.5, 0.25], warn: 50, dmg: 0.5, ticks: 3, tick_every: 50}   # le linee della stella bruciano
      fury: {at: 0.25, rate_mult: 0.67}                                         # ultimo quarto piu' veloce
      tithe: {every: 600, warn: 75, drain_pct: 6, heal_mult: 3}                # la decima: ruba vita al PG, si cura
