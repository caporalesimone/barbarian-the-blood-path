# Chapters of the game (11/11, docs/wiki/capitoli.md, docs/wiki/quests.md 3.8). Read by tools/build/chapters_db.py, which computes the
# two counters: the LOCAL level (1..levels, restarts in every chapter: what the player sees) and the GLOBAL depth
# (1..global_max: levels of the previous chapters + local level; it drives the difficulty). The last chapter with
# `levels: rest` (the Abyss) takes the levels left up to global_max. Users: tools/simulators/chapters.py (balancing per chapter),
# tools/atlas/gen_atlas.py (one section per chapter), the bestiaries (data/monsters/bestiary.tsv: `floor` = global depth).
# The game code does NOT know chapters yet (TODO M9): see `today`. Rule of the owner (11/11 evening): 5 levels per chapter
# (the last one = final map), the Abyss apart; the game keeps the 5 level states of the current chapter in RAM.
#
# Fields: id, name, implemented (in the game code), village (name, gfx file, map, pf_n, atlas_set), levels (how many,
# the last one is the final map), themes (dungeon palettes GFXn), atlas_sets, final (final map: name, file, generator,
# atlas_set, boss = id in the bestiary).

global_max: 255
today: {levels: 20, note: "one village (Aldric's Crossing), levels 1-19 generated + the throne room on level 20 = depth 1-20"}

chapters:
  - id: 1
    name: "Aldric's Crossing"
    implemented: false
    village: {name: "Aldric's Crossing", gfx: TWN1, map: data/town_map.txt, pf_n: 8, atlas_set: VILLG}
    levels: 5
