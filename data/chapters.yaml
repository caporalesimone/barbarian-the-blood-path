# Chapters of the game (11/11, docs/wiki/capitoli.md, docs/wiki/quests.md 3.8). Read by tools/build/chapters_db.py, which computes the
# two counters: the LOCAL level (1..levels, restarts in every chapter: what the player sees) and the GLOBAL depth
# (1..global_max: levels of the previous chapters + local level; it drives the difficulty). The last chapter with
# `levels: rest` (the Abyss) takes the levels left up to global_max. Users: tools/simulators/chapters.py (balancing per chapter),
# tools/atlas/gen_atlas.py (one section per chapter), the bestiaries (data/monsters/bestiary.tsv: `floor` = global depth).
# The game code does NOT know chapters yet (TODO M9): see `today`. Rule of the owner (11/11 evening): 5 levels per chapter
# (the last one = final map), the Abyss apart; the game keeps the 5 level states of the current chapter in RAM.
#
# Fields: id, name, implemented (in the game code), village (name, gfx file, map, pf_n, atlas_set), levels (how many,
# the last one is the final map), themes (dungeon palettes GFXn), atlas_sets, final (final map: name, file, generator,
# atlas_set, boss = id in the bestiary).
# (18/11) map (optional): look of the generated levels of the chapter (not the final map). style: rooms (default: rooms and
# corridors), caves, swamp or citadel (docs/wiki/dungeon.md); palettes: palette of each generated level, local level 1, 2, ... (0 or missing =
# the random palette of today, from seed and level). Compiled by tools/build/gen_db.py into lv_look (one byte per level).
# (19/11) final.palette (chapters 1-3): palette of the boss level (the fixed map of tools/build/gen_bossmap.py, tiles of
# tools/build/boss_gfx.py); missing = red (4), as the throne room.

global_max: 255
today: {levels: 20, note: "one village (Aldric's Crossing), levels 1-19 generated + the throne room on level 20 = depth 1-20"}

chapters:
  - id: 1
    name: "Aldric's Crossing"
    implemented: false
    village: {name: "Aldric's Crossing", gfx: TWN1, map: data/town_map.txt, pf_n: 8, atlas_set: VILLG}
    levels: 5
    themes: [1, 2]
    atlas_sets: [DUNGA, DUNGB]
    final: {name: "The Crypt of the Abbot", file: data/maps/bosschap1.txt, generator: tools/build/gen_bossmap.py, atlas_set: BOSS1, boss: hollow_abbot, palette: 8}

  - id: 2
    name: "Bad Water"
    implemented: false
    village: {name: "Bad Water", gfx: TWN2, map: data/town_map2.txt, pf_n: null, atlas_set: VILL2}
    levels: 5
    themes: [3, 4]
    map: {style: swamp, palettes: [12, 12, 12, 12]}     # (18/11, owner) one swamp: levels 6-9 side by side, gates on the borders
    atlas_sets: [SWAMP, DUNGD]
    final: {name: "The Dollmaker's Isle", file: data/maps/bosschap2.txt, generator: tools/build/gen_bossmap.py, atlas_set: BOSS2, boss: mother_stitch, palette: 12}

  - id: 3
    name: "The Last Camp"
    implemented: false
    village: {name: "The Last Camp", gfx: TWN3, map: data/town_map3.txt, pf_n: null, atlas_set: VILL3}
    levels: 5
    themes: [5, 6]
    map: {style: caves, palettes: [9, 11, 10, 10]}      # (18/11, owner) level 11 white snowy caves, 12 icy (light blue), 13-14 grey rock
    atlas_sets: [CAVSN, CAVIC, CAVRK]
    final: {name: "The Broken Bastion", file: data/maps/bosschap3.txt, generator: tools/build/gen_bossmap.py, atlas_set: BOSS3, boss: varok_oathbreaker, palette: 10}

  - id: 4
    name: "The Throne of Ruin"
    implemented: false
    village: {name: "Ruin's Gate", gfx: TWN4, map: data/town_map4.txt, pf_n: null, atlas_set: VILL4}
    levels: 5
    themes: [7, 8]
    map: {style: citadel}                                # (19/11, prototype) BSP-like halls with columns, left/right symmetry
    atlas_sets: [DUNGG, DUNGH]
    final: {name: "The Throne of Ruin", file: FMAP, generator: tools/build/gen_final.py, atlas_set: TRONO, boss: lord_of_ruin}

  - id: 5
    name: "The Abyss"
    implemented: false
    village: {name: "The City of the Abyss", gfx: TWN5, map: data/town_map5.txt, pf_n: null, atlas_set: VILL5}
    levels: rest
    themes: [1, 2, 3, 4, 5, 6, 7]
    atlas_sets: []
    final: null
