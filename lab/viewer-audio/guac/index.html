<!doctype html><meta charset="utf-8"><title>guac proto</title>
<style>body{margin:0;background:#000} #d{position:absolute;inset:0}</style>
<div id="d"></div>
<script>var module={exports:{}},exports=module.exports;</script>
<script src="guac.js"></script>
<script>
const G = window.Guacamole;
(async () => {
  const t = await (await fetch('/token')).text();
  const tunnel = new G.WebSocketTunnel('ws://' + location.hostname + ':8080/');
  const client = new G.Client(tunnel);
  document.getElementById('d').appendChild(client.getDisplay().getElement());
  client.onerror = e => console.log('guac error', e && e.message);
  client.connect('token=' + encodeURIComponent(t));
  window.guacClient = client;
})();
</script>
